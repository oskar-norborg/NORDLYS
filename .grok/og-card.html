<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("/fonts/ibm-plex-sans-500.woff2") format("woff2");
      font-weight: 500;
    }
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("/fonts/ibm-plex-sans-600.woff2") format("woff2");
      font-weight: 600;
    }
    html, body { margin: 0; padding: 0; width: 1200px; height: 630px; }
    body {
      background: #090c0b;
      color: #e4eae6;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px 72px;
      box-sizing: border-box;
    }
    .kicker { letter-spacing: 0.28em; font-size: 14px; color: #8fbfb2; text-transform: uppercase; }
    h1 { font-size: 92px; font-weight: 600; letter-spacing: 0.18em; margin: 18px 0 0; }
    p { font-size: 28px; color: #8b958f; max-width: 820px; line-height: 1.35; margin: 20px 0 0; }
    .foot { display: flex; justify-content: space-between; color: #5c6560; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; }
    .rule { height: 1px; background: #232a27; margin: 0; }
  </style>
</head>
<body>
  <div>
    <div class="kicker">Private wealth</div>
    <h1>NORDLYS</h1>
    <p>Client planning, risk, and a 10,000-path Monte Carlo. Entirely in the browser.</p>
  </div>
  <div>
    <div class="rule"></div>
    <div class="foot" style="margin-top: 28px;">
      <span>Planner · Diagnostics</span>
      <span>Local data only</span>
    </div>
  </div>
</body>
</html>
